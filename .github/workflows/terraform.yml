name: Terraform CI

on:
  push:
    branches:
      - feature

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: azure_resource

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
            # Azure ke secrets jo aapne GitHub Settings me dale hain
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # 4. Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 6. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # 7. Generate Terraform Plan
      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"


          # Azure ke secrets jo aapne GitHub Settings me dale hain
  